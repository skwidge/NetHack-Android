plugins {
  id 'com.android.application'
}

// Release signing: reads keystore.properties (git-ignored) or NETHACK_* env vars.
// Without either, the release build is left unsigned (as CI does).
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) {
  signingFile.withInputStream { signingProps.load(it) }
}
def signingValue = { String key ->
  signingProps.getProperty(key) ?: System.getenv('NETHACK_' + key.toUpperCase())
}

android {

  // Kept as the original package so the generated R class stays com.tbd.NetHack.R
  namespace 'com.tbd.NetHack'
  compileSdk 36
  // Must match the NDK the Makefile uses, so Gradle can strip libnethack.so
  ndkVersion '27.3.13750724'

  defaultConfig {
    applicationId 'com.skwidge.nethack'
    minSdk 24
    targetSdk 36
    versionName '3.6.7-5'
    versionCode 3675
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  signingConfigs {
    release {
      def path = signingValue('storeFile')
      if (path) {
        storeFile file(path)
        storePassword signingValue('storePassword')
        keyAlias signingValue('keyAlias')
        keyPassword signingValue('keyPassword')
      }
    }
  }

  buildTypes {
    release {
      if (signingConfigs.release.storeFile != null) {
        signingConfig signingConfigs.release
      }
      // Ship a stripped libnethack.so and keep its symbols in the bundle for Play
      ndk {
        debugSymbolLevel 'FULL'
      }
    }
  }

  lint {
    disable 'MissingClass'
  }

  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      res.srcDirs = ['res']
      assets.srcDirs = ['assets']
      jniLibs.srcDirs = ['libs']
    }
  }
}

dependencies {
  implementation project(':forkfront')
}
