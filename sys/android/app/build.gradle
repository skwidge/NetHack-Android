plugins {
  id 'com.android.application'
}

android {

  // Kept as the original package so the generated R class stays com.tbd.NetHack.R
  namespace 'com.tbd.NetHack'
  compileSdk 36

  defaultConfig {
    applicationId 'com.skwidge.nethack'
    minSdk 21
    targetSdk 36
    versionName '3.6.7-2'
    versionCode 3672
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  lint {
    disable 'MissingClass'
  }

  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      res.srcDirs = ['res']
      assets.srcDirs = ['assets']
      jniLibs.srcDirs = ['libs']
    }
  }
}

dependencies {
  implementation project(':forkfront')
}
